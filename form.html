<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form | WDD 131</title>
  <meta name="author" content="Ignacio Damian Jofré Alonso">
  <meta name="description" content="Share your experience with our products and leave a detailed review. Rate quality, features, and installation to help others choose the best option.">

  <link rel="stylesheet" href="styles/form.css">
  <script  src="scripts/form.js" defer></script>
  
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <p>* Required fields</p>
    <form method="get" action="review.html">
      <!-- Product Name -->
      <label for="product">Product Name <span class="req" aria-hidden="true">*</span></label>
      <select name="product" id="product" required>
        <option value="" disabled selected>Select a Product...</option>
      </select>

      <!-- Overal Rating -->
      <fieldset>
        <legend>Overall Rating <span class="req" aria-hidden="true">*</span></legend>
        <div class="rating">
          <label for="star1"><input type="radio" id="star1" name="rating" value="1" required> 1 ⭐</label>
          <label for="star2"><input type="radio" id="star2" name="rating" value="2" required> 2 ⭐</label>
          <label for="star3"><input type="radio" id="star3" name="rating" value="3" required> 3 ⭐</label>
          <label for="star4"><input type="radio" id="star4" name="rating" value="4" required> 4 ⭐</label>
          <label for="star5"><input type="radio" id="star5" name="rating" value="5" required> 5 ⭐</label>
        </div>
      </fieldset>

      <!-- Date of Installation -->
       <label for="installDate">Date of Installation <span class="req" aria-hidden="true"></span></label>
       <input type="date" id="installDate" name="installDate" required>

       <fieldset>
        <legend>Which features did you find useful? (Check all that apply)</legend>
        <label><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
        <label><input type="checkbox" id="ease" name="features" value="ease"> Ease of Use</label>
        <label><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
        <label><input type="checkbox" id="design" name="features" value="design"> Design</label>
       </fieldset>

       <!-- Written Review -->
        <label for="review">Written Review (optional)</label>
        <textarea name="review" id="review" rows="4"></textarea>

       <!-- User Name -->
        <label for="username">Your Name (optional)</label>
        <input type="text" id="username" name="username">

        <!-- Submit Button -->
        <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> 🐠Ignacio D. Jofré 🐠Argentina</p>
    <p class="last-modified"> Last Modification: <span id="lastModified"></span></p>
  </footer>
  

</body>
</html>
